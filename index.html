<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Student Management System</h1>
            <p>Manage student records easily</p>
        </div>
    </header>

    <main class="container">

        <!-- Add Student Section -->
        <section class="card">
            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="CSE">CSE</option>
                        <option value="AIML">AIML</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <button type="submit" id="submitButton">
                    Add Student
                </button>

                <button type="button" id="cancelButton" class="cancel-btn" hidden>
                    Cancel Edit
                </button>

            </form>
        </section>


        <!-- Student List Section -->
        <section class="card">

            <div class="section-header">
                <div>
                    <h2>Student Records</h2>
                    <p id="studentCount">Loading students...</p>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search students..."
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                    </tbody>

                </table>

            </div>

            <p id="emptyMessage" class="empty-message" hidden>
                No students found.
            </p>

        </section>

    </main>

    <footer>
        <p>Student Management System | Full Stack Development</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
